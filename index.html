<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Las Vegas Strip Walking Guide</title>
  <meta name="description" content="Interactive walking guide for the Las Vegas Strip. Find the best route between hotels using indoor walkways, pedestrian bridges, free trams, and the monorail.">
  <meta name="theme-color" content="#1a1a2e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin="">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="site-header">
    <h1>Las Vegas Strip Walking Guide</h1>
    <p>Navigate the Strip on foot &mdash; hotel to hotel, the smart way</p>
  </header>

  <main class="container">

    <!-- Route Finder -->
    <section class="route-finder">
      <div class="route-finder-header">
        <h2>Find Your Route</h2>
        <button class="locate-btn" id="locate-btn" title="Find nearest hotel to your location">
          <span class="locate-icon">&#x1F4CD;</span> Near Me
        </button>
      </div>

      <div class="route-inputs">
        <div class="input-group">
          <label for="from-select">Starting Point</label>
          <select id="from-select"></select>
        </div>

        <button class="swap-btn" id="swap-btn" title="Swap start and destination">&lrhar;</button>

        <div class="input-group">
          <label for="to-select">Destination</label>
          <select id="to-select"></select>
        </div>
      </div>

      <!-- Multi-stop waypoints -->
      <div class="waypoints-section" id="waypoints-section">
        <div class="waypoints-list" id="waypoints-list"></div>
        <button class="add-stop-btn" id="add-stop-btn">+ Add Stop</button>
      </div>

      <div class="route-options">
        <label>
          <input type="checkbox" id="opt-monorail" checked>
          Use Monorail ($5/ride)
        </label>
        <label>
          <input type="checkbox" id="opt-trams" checked>
          Use Free Trams
        </label>
        <label>
          <input type="checkbox" id="opt-indoor" >
          Prefer Indoor Routes
        </label>
      </div>

      <button class="find-btn" id="find-route-btn">Find Best Route</button>

      <!-- Route action buttons -->
      <div class="route-actions" id="route-actions" style="display:none;">
        <button class="action-btn share-btn" id="share-btn" title="Share this route">
          <span>&#x1F517;</span> Share Route
        </button>
        <button class="action-btn save-btn" id="save-btn" title="Save this route">
          <span>&#x2606;</span> Save Route
        </button>
      </div>

      <div id="route-results"></div>
    </section>

    <!-- Saved Routes -->
    <section class="saved-routes" id="saved-routes-section" style="display:none;">
      <h2>Saved Routes</h2>
      <div id="saved-routes-list"></div>
    </section>

    <!-- Tabbed Content -->
    <section class="tabs">
      <nav class="tab-nav">
        <button class="tab-btn active" data-tab="tab-interactive-map">Interactive Map</button>
        <button class="tab-btn" data-tab="tab-map">Strip Layout</button>
        <button class="tab-btn" data-tab="tab-transit">Transit Guide</button>
        <button class="tab-btn" data-tab="tab-tips">Walking Tips</button>
      </nav>

      <div class="tab-panel active" id="tab-interactive-map">
        <div id="leaflet-map"></div>
      </div>

      <div class="tab-panel" id="tab-map">
        <div id="strip-map"></div>
      </div>

      <div class="tab-panel" id="tab-transit"></div>

      <div class="tab-panel" id="tab-tips"></div>
    </section>

  </main>

  <footer class="site-footer">
    <p>Las Vegas Strip Walking Guide &mdash; Making the Strip walkable, one route at a time.</p>
    <p>Information is approximate and subject to change. Always verify hours and availability on-site.</p>
  </footer>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
          crossorigin=""></script>
  <script src="js/data.js"></script>
  <script src="js/pathfinder.js"></script>
  <script src="js/map.js"></script>
  <script src="js/app.js"></script>

  <script>
    // Register service worker for offline support
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    }
  </script>

</body>
</html>
